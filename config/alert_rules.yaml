alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95(response_sent.latency_ms) > 3000 ms"
    duration: 5m
    type: symptom-based
    owner: student-2A202602716
    slack_channel: "#k4-l3b-alerts"
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: "request_failed / request_received > 2%"
    duration: 5m
    type: symptom-based
    owner: student-2A202602716
    slack_channel: "#k4-l3b-alerts"
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: "mean(response_sent.quality_score) < 0.75"
    duration: 10m
    type: symptom-based
    owner: student-2A202602716
    slack_channel: "#k4-l3b-alerts"
    runbook: docs/alerts.md#alert-3
